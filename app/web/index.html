<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CTP-WireLakes member portal for Community Trainers and E-Fundis.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CTP-WireLakes">
  <link rel="apple-touch-icon" href="icons/Icon-apple.png">

  <!-- Favicon: the programme's own mark, as on the website -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

  <title>CTP-WireLakes</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    The first open pulls the whole app across the host's shared line, which takes a while. This screen is what
    a member sees while that happens, and it goes the moment the app paints its first frame.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #04491a; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; color: #eaf6e2; font: 500 15px/1.5 system-ui, sans-serif; }
    #boot img { width: 86px; height: 86px; border-radius: 22px; background: #eaf6e2; padding: 10px; }
    #boot .ring { width: 34px; height: 34px; border-radius: 50%; border: 4px solid rgba(234,246,226,.28);
      border-top-color: #4cb614; animation: spin 1s linear infinite; }
    #boot .slow { opacity: .72; max-width: 30ch; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot .ring { animation: none; } }
  </style>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="WireLakes Technologies">
    <div class="ring"></div>
    <div id="boot-line">Opening the WireLakes app…</div>
  </div>
  <script>
    new MutationObserver(function () {
      if (document.querySelector('flutter-view canvas')) {
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
      }
    }).observe(document.body, { childList: true, subtree: true });
    setTimeout(function () {
      var line = document.getElementById('boot-line');
      if (line) line.textContent = 'Still getting the app — this happens once, then it opens fast.';
    }, 20000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
